name: Deploy docs site (Astro + Proto-UI)

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "README.md", "results/**/*.md", "llms.txt"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - name: Install deps
        working-directory: site
        run: npm install
      - name: Generate llms.txt
        run: node site/scripts/gen-llms-txt.mjs
      - name: Build Astro
        working-directory: site
        run: npx astro build
      - name: Copy llms.txt into dist
        run: cp llms.txt site/dist/llms.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
